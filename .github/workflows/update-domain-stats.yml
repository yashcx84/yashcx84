name: Update Live Business Domain Stats

on:
  schedule:
    # Runs automatically twice a day at 00:00 & 12:00 UTC
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual run button in Actions tab
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Profile Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Recalculate and Update Domain Stats
        env:
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: node scripts/update-stats.mjs

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes in domain counts."
          else
            git commit -m "chore(stats): auto-update live business domain counts [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi